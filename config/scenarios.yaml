randomizer:
  coverage_radius_m: [350, 1300]
  traffic:
    - {name: Clear water, weight: 2, contacts: [2, 3]}
    - {name: Quiet, weight: 4, contacts: [3, 8]}
    - {name: Working harbor, weight: 5, contacts: [9, 30]}
    - {name: Busy, weight: 3, contacts: [31, 80]}
    - {name: Peak surge, weight: 1, contacts: [81, 200]}
  regions:
    open_water: [[300, 220, 1560, 960]]
    research_box: [[330, 950, 380, 160]]
    dive_site: [[560, 380, 80, 80]]
    far_south: [[1350, 1085, 500, 60], [400, 1085, 300, 40]]
    ship_close: [[1110, 260, 80, 220]]
    ship_medium: [[1250, 300, 100, 180]]
    fuel_dock: [[1570, 300, 280, 70]]
    entrance: [[950, 1120, 320, 60]]
    lost_start: [[380, 940, 420, 180]]
  slots:
    debris:
      variants:
        - {archetype: bottle, label: debris}
        - {archetype: kelp, label: debris}
      region: open_water
      conf: [0.78, 0.94]
    marine_life:
      archetype: fish
      label: biologic
      region: open_water
      conf: [0.78, 0.95]
      speed: [0.3, 0.8]
    equipment:
      archetype: equipment
      label: debris
      region: open_water
      conf: [0.8, 0.94]
    known_vehicle:
      max: 1
      hail: {ok: 1}
      variants:
        - {archetype: research_sub, transponder: USC-REMUS-01, region: research_box, survey: true,
           label: research_auv, conf: [0.8, 0.92], speed: [0.8, 1.3]}
        - {archetype: inspection_rov, transponder: HDS-ROV-7, region: dive_site, motion: loiter,
           label: commercial_rov, conf: [0.8, 0.9], speed: [0.2, 0.4]}
    stray_research:
      archetype: stray_research
      label: research_auv
      region: far_south
      conf: [0.5, 0.66]
      speed: [0.15, 0.3]
      hail: {none: 0.6, ok: 0.4}
    unknown_far:
      archetype: unknown_far
      label: unknown
      region: far_south
      conf: [0.36, 0.5]
      step: [0.02, 0.05]
      speed: [0.15, 0.3]
      hail: {none: 0.8, ok: 0.2}
    unknown_ship_close:
      archetype: unknown
      label: unknown
      region: ship_close
      motion: loiter
      conf: [0.38, 0.52]
      step: [0.02, 0.05]
      speed: [0.1, 0.25]
    unknown_ship_medium:
      archetype: unknown
      label: unknown
      region: ship_medium
      motion: loiter
      conf: [0.38, 0.52]
      step: [0.02, 0.05]
      speed: [0.1, 0.25]
    unknown_fuel_dock:
      archetype: unknown
      label: unknown
      region: fuel_dock
      motion: loiter
      conf: [0.38, 0.52]
      step: [0.02, 0.05]
      speed: [0.1, 0.25]
    evasive:
      max: 1
      archetype: evasive
      label: unknown
      region: entrance
      conf: [0.45, 0.58]
      speed: [0.7, 1.1]
      heading: [-30, 30]
      spawn_t: [3, 20]
    lost_vehicle:
      max: 1
      archetype: research_sub
      signature: remus-100-sn02
      motion: straight
      hail: {none: 1}
      region: lost_start
      label: research_auv
      conf: [0.58, 0.64]
      step: [0.09, 0.14]
      looks: 3
      speed: [0.3, 0.5]
      heading: [50, 110]
      answers: {p: 0.5, t: [90, 200], transponder: USC-REMUS-02}
    drifting_package:
      archetype: unknown
      label: unknown
      region: ship_medium
      motion: drift
      conf: [0.4, 0.55]
      speed: [0.05, 0.12]
    look_alike:
      max: 1
      archetype: stray_research
      label: research_auv
      region: far_south
      conf: [0.6, 0.7]
      speed: [0.1, 0.25]
  security:
    required:
      - [unknown_fuel_dock, unknown_ship_close]
      - [evasive]
      - [unknown_ship_medium]
      - [debris, marine_life]
    fill: {debris: 3, marine_life: 4, known_vehicle: 2, stray_research: 1, unknown_far: 2,
           unknown_ship_close: 0.5, unknown_ship_medium: 0.5, unknown_fuel_dock: 0.5, evasive: 1}
  recovery:
    required:
      - [lost_vehicle]
      - [drifting_package]
      - [equipment, marine_life]
    fill: {equipment: 3, marine_life: 3, debris: 2, known_vehicle: 1.5, look_alike: 1}

scenarios:
