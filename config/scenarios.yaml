        speed_mps: 0.7
        waypoints: [[1725, 360]]
      - {id: C-108, archetype: evasive, spawn_t: 25, start: [1060, 1180], heading: 350}
    generator:
      count: 196
      prefix: F
      mix: {fish: 0.48, bottle: 0.16, kelp: 0.12, unknown_far: 0.14, stray_research: 0.06, survey_rov: 0.04}
      regions:
        unknown_far: [[1350, 1080, 520, 70], [300, 1010, 400, 110]]
        stray_research: [[1350, 1080, 520, 70], [300, 1010, 400, 110]]

  lost_vehicle:
    title: Lost REMUS-02
    description: USC's REMUS-02 lost comms at 07:31 during a sediment survey and is drifting east. Same sonar, same engine, a different job.
    mode: recovery
    seed: 3
    duration_s: 300
