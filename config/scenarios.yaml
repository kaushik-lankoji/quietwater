      - {id: C-101, archetype: bottle, start: [720, 1000]}
      - {id: C-102, archetype: fish, start: [1300, 980], heading: 200}
      - {id: C-103, archetype: fish, start: [820, 430], heading: 90}
      - id: C-104
        archetype: research_sub
        transponder: USC-REMUS-01
        start: [360, 960]
        waypoints: [[700, 960], [700, 1010], [360, 1010], [360, 1060], [700, 1060], [700, 1100], [360, 1100]]
        loop: true
