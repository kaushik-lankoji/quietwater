  flood:
    title: Flood (200 contacts)
    description: A spring bloom - 200 sonar contacts. The ladder keeps the officer's queue short.
    mode: security
    seed: 42
    duration_s: 240
    contacts:
      - id: C-104
        archetype: research_sub
        transponder: USC-REMUS-01
        start: [360, 960]
        waypoints: [[700, 960], [700, 1060], [360, 1060]]
