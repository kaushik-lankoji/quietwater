    description: A surface operator can answer by radio; a submerged vehicle with no compatible link cannot be hailed.
    mode: security
    seed: 23
    duration_s: 180
    contacts:
      - {id: LINK-1, archetype: unknown_far, start: [1600, 1110], heading: 270, hail_route: unavailable}
      - {id: LINK-2, archetype: unknown, start: [1180, 400], motion: loiter, speed_mps: 0.2, hail_route: surface}

  all_archetypes:
    title: Every archetype
    description: One of each - bottle, fish, research sub, unknown far, near a ship, near the fuel dock, evasive, improvised device, military.
    mode: security
    seed: 11
    duration_s: 240
    contacts:
      - {id: A-1, archetype: bottle, start: [700, 1000]}
      - {id: A-2, archetype: fish, start: [1300, 1000], heading: 30}
      - id: A-3
        archetype: research_sub
        transponder: USC-REMUS-01
        start: [360, 960]
        waypoints: [[700, 960], [700, 1060], [360, 1060]]
        loop: true
